<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alokpo</title>
    
    <!-- SEO & Google Search Optimization -->
    <meta name="description" content="Alokpo - A private, decentralized meta search engine.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    
    <!-- Open Graph for Social Media & Rich Snippets -->
    <meta property="og:title" content="Alokpo">
    <meta property="og:description" content="Private, decentralized search engine">
    <meta property="og:image" content="favicon.svg">
    <meta property="og:type" content="website">

    <!-- JSON-LD Structured Data to force Google to recognize the Logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Alokpo",
      "url": "https://alokpo.com/",
      "logo": "https://alokpo.com/favicon.svg"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Alokpo",
      "url": "https://alokpo.com/"
    }
    </script>
    <!-- Modern Typography from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <svg id="themeIconSun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="themeIconMoon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <main class="container">
        <!-- Logo / Title -->
        <header class="header">
            <img id="mainLogo" class="main-logo" src="2.svg" alt="Alokpo Logo">
        </header>

        <!-- Search Area -->
        <section class="search-section">
            <form id="searchForm" class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search with Alokpo" autocomplete="off" required>
                <button type="submit" class="search-button">Search</button>
            </form>
            <ul id="suggestionsBox" class="suggestions-box hidden"></ul>
        </section>

        <!-- Loading State -->
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <!-- Results Area -->
        <section id="resultsContainer" class="results-container">
            <!-- Results will be injected here via JavaScript -->
        </section>
    </main>



    <script src="script.js"></script>
</body>
</html>
